<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171209"/>
      <stop offset="1" stop-color="#0d0b07"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0d28a"/>
      <stop offset="1" stop-color="#c98f2c"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6b5330"/>
      <stop offset="1" stop-color="#a8823f"/>
    </linearGradient>
  </defs>

  <rect width="960" height="280" rx="20" fill="url(#bg)"/>

  <!-- 等高线：山野底纹 -->
  <g fill="none" stroke="#241c10" stroke-width="1.5">
    <path d="M-20,212 C150,172 280,252 450,202 S780,142 980,192"/>
    <path d="M-20,244 C160,209 300,279 470,234 S790,179 980,224"/>
    <path d="M-20,60 C140,40 320,86 480,58 S760,30 980,66"/>
  </g>

  <!-- 步道：虚线小径蜿蜒向上（暗部），亮部做流动动画 -->
  <path d="M70,240 C190,240 210,160 340,160 S480,105 612,118"
        fill="none" stroke="#2c2416" stroke-width="9" stroke-linecap="round"/>
  <path id="route" d="M70,240 C190,240 210,160 340,160 S480,105 612,118"
        fill="none" stroke="url(#trail)" stroke-width="2.5" stroke-dasharray="3 10" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="26;0" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <!-- 路标石（节点）：已抵达 / 行进中 / 未启程 -->
  <g>
    <circle cx="70" cy="240" r="8" fill="url(#amber)"/>
    <circle cx="340" cy="160" r="8" fill="#8a6d3b" stroke="#f0d28a" stroke-width="2">
      <animate attributeName="r" values="8;10;8" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="612" cy="118" r="8" fill="none" stroke="#6b5a3e" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- 字标 -->
  <text x="648" y="116" font-size="56" font-weight="800" fill="url(#amber)" letter-spacing="1">waymark</text>
  <text x="651" y="156" font-size="18" fill="#a08c68">/plan 驱动的项目进度工作流路标</text>
</svg>
