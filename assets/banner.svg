<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 纸面底 + 等高线 -->
  <rect width="960" height="280" rx="20" fill="#f5f0e6"/>
  <g fill="none" stroke="#e0d7c2" stroke-width="1.5">
    <path d="M-20,44 C140,26 300,62 470,40 S780,18 980,50"/>
    <path d="M-20,206 C150,176 300,232 480,200 S800,168 980,204"/>
    <path d="M-20,240 C160,214 320,262 500,234 S810,202 980,236"/>
  </g>

  <!-- 国家公园徽章 -->
  <g>
    <circle cx="150" cy="140" r="110" fill="#22402f"/>
    <circle cx="150" cy="140" r="101" fill="none" stroke="#f5f0e6" stroke-width="6" stroke-dasharray="3 12"/>
    <circle cx="150" cy="140" r="92" fill="#f5f0e6"/>
    <circle cx="180" cy="112" r="12" fill="#c8501c"/>
    <path d="M93,175 L136,121 L164,155 L189,118 L227,175 Z" fill="#22402f"/>
    <text x="150" y="202" text-anchor="middle" font-size="20" font-weight="700"
          letter-spacing="2" fill="#22402f">WAYMARK</text>
    <text x="150" y="219" text-anchor="middle" font-size="8" font-weight="600"
          letter-spacing="2.5" fill="#c8501c">TRAIL PROGRESS</text>
  </g>

  <!-- 步道：虚线小径 + 三态路标 -->
  <path d="M268,150 C350,186 460,100 545,128" fill="none"
        stroke="#b6460f" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>
  <circle cx="268" cy="150" r="6" fill="#22402f"/>
  <circle cx="400" cy="136" r="6" fill="#c8501c"/>
  <circle cx="545" cy="128" r="6" fill="#f5f0e6" stroke="#22402f" stroke-width="2"/>

  <!-- 字标 -->
  <text x="590" y="132" font-size="52" font-weight="800"
        letter-spacing="8" fill="#22402f">WAYMARK</text>
  <text x="593" y="170" font-size="17" fill="#b6460f">/plan 驱动的项目进度工作流路标</text>
  <rect x="593" y="184" width="120" height="3" fill="#c8501c"/>
</svg>
